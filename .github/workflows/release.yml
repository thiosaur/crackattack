# Release pipeline, triggered by a version tag (v2.1.0).
#
# 1. The tag must equal "v" + the workspace version in Cargo.toml, and the whole test suite
#    must pass on the tagged commit (including the reference files of released versions).
# 2. Linux, Windows and macOS packages are built with CRACKATTACK_DISTRIBUTION=direct
#    (the stamp that enables the daily update check) and checked: `--version` must report
#    "(direct)" and the game data must be in the package.
# 3. A DRAFT release is created with the three packages. Drafts are invisible to players
#    and to the "latest release" API: publishing the draft by hand, after trying the
#    packages, is the last step and the one that makes the version visible.
#
# A platform that fails blocks the whole release (no partial release).
#
# Run by hand (Actions → Release → Run workflow), the same pipeline builds every package of the
# Cargo.toml version and keeps them as workflow artifacts, without any release: a way to try a
# packaging change before tagging.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-tag:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: check-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies (SDL3 built from source, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-test
      - run: cargo test --workspace --locked

  build:
    needs: [check-tag, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Oldest supported runner image: the Linux binary then runs on older glibc too.
          - os: ubuntu-22.04
            platform: linux-x86_64
            exe: crackattack
          - os: windows-latest
            platform: windows-x86_64
            exe: crackattack.exe
          - os: macos-latest
            platform: macos-arm64
            exe: crackattack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      CRACKATTACK_DISTRIBUTION: direct
      # Oldest macOS announced in Info.plist (LSMinimumSystemVersion); ignored on other systems.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libdbus-1-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - name: Build
        run: cargo build --release --locked -p crackattack-webgpu

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party notices
        # about.toml covers the three package targets; --fail stops on any unresolved license.
        run: cargo about generate --locked --fail -m crackattack-webgpu/Cargo.toml about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Check the stamp
        shell: bash
        run: |
          out=$(target/release/${{ matrix.exe }} --version)
          echo "$out"
          [ "$out" = "crackattack $VERSION (direct)" ] || { echo "::error::unexpected --version: $out"; exit 1; }

      - name: Package
        shell: bash
        run: |
          name="crackattack-$VERSION-${{ matrix.platform }}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="dist/$name/Crack Attack.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp target/release/crackattack "$app/Contents/MacOS/"
            cp -R crackattack-webgpu/assets "$app/Contents/Resources/assets"
            # Finder and Dock icon, from the 512 px app icon (no upscaled 1024 px size).
            iconset="$RUNNER_TEMP/AppIcon.iconset"
            mkdir -p "$iconset"
            src=crackattack-webgpu/assets/textures/ui/app_icon.png
            for s in 16 32 128 256 512; do
              sips -z $s $s "$src" --out "$iconset/icon_${s}x${s}.png" > /dev/null
              if [ $s -lt 512 ]; then
                sips -z $((s*2)) $((s*2)) "$src" --out "$iconset/icon_${s}x${s}@2x.png" > /dev/null
              fi
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"
            cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Crack Attack</string>
            <key>CFBundleDisplayName</key><string>Crack Attack!</string>
            <key>CFBundleIdentifier</key><string>io.github.thiosaur.crackattack</string>
            <key>CFBundleExecutable</key><string>crackattack</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>Crack Attack! finds other players on your local network for network games.</string>
            <key>NSBonjourServices</key><array><string>_crackattack._udp</string></array>
          </dict></plist>
          EOF
            cp LICENSE AUTHORS README.md THIRD-PARTY-LICENSES.html "dist/$name/"
            # The disk image holds only the app: the licences travel inside it.
            cp LICENSE AUTHORS THIRD-PARTY-LICENSES.html "$app/Contents/Resources/"
            # Ad-hoc signature (no Apple account): required for arm64, not a notarisation.
            codesign --force --deep --sign - "$app"
            # The game finds its data from the executable's location.
            test -f "$app/Contents/Resources/assets/textures/ui/logo.png"
            test -s "$app/Contents/Resources/AppIcon.icns"
            (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
            # Disk image: the app next to a link to Applications, on a background with an
            # arrow. dmgbuild writes the window layout itself (no Finder scripting, which is
            # unreliable on a runner); the version is pinned.
            python3 -m venv "$RUNNER_TEMP/dmgvenv"
            "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild==1.6.7
            "$RUNNER_TEMP/dmgvenv/bin/dmgbuild" -s packaging/macos/dmg-settings.py \
              -D app="$app" -D dir=packaging/macos "Crack Attack" "dist/$name.dmg"
          else
            mkdir -p "dist/$name"
            cp "target/release/${{ matrix.exe }}" "dist/$name/"
            cp -R crackattack-webgpu/assets "dist/$name/assets"
            cp LICENSE AUTHORS README.md THIRD-PARTY-LICENSES.html "dist/$name/"
            test -f "dist/$name/assets/textures/ui/logo.png"
            if [ "$RUNNER_OS" = "Windows" ]; then
              (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
              # AppImage: one executable file. The game reads its data next to its binary.
              appdir="$RUNNER_TEMP/CrackAttack.AppDir"
              mkdir -p "$appdir/usr/lib/crackattack"
              cp target/release/crackattack "$appdir/usr/lib/crackattack/"
              cp -R crackattack-webgpu/assets "$appdir/usr/lib/crackattack/assets"
              cp packaging/linux/crackattack.desktop "$appdir/"
              cp crackattack-webgpu/assets/textures/ui/app_icon.png "$appdir/crackattack.png"
              printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$(readlink -f "$0")")/usr/lib/crackattack/crackattack" "$@"' > "$appdir/AppRun"
              chmod +x "$appdir/AppRun"
              curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
                https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
              echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum -c -
              chmod +x "$RUNNER_TEMP/appimagetool"
              ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$RUNNER_TEMP/appimagetool" "$appdir" "dist/$name.AppImage"
            fi
          fi
          ls -l dist

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "crackattack-$env:VERSION-${{ matrix.platform }}"
          magick crackattack-webgpu/assets/textures/ui/app_icon.png -define icon:auto-resize=256,128,64,48,32,16 "dist/$name/AppIcon.ico"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\$name" "/DOutputDir=$PWD\dist" "/DOutputBase=$name-setup" packaging\windows\crackattack.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*.AppImage
            dist/*-setup.exe
          retention-days: 7

  draft:
    needs: [check-tag, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | System | Installer | Archive |
          |---|---|---|
          | Windows (x86_64) | `crackattack-VERSION-windows-x86_64-setup.exe` | `crackattack-VERSION-windows-x86_64.zip` |
          | macOS (Apple Silicon) | `crackattack-VERSION-macos-arm64.dmg` | `crackattack-VERSION-macos-arm64.zip` |
          | Linux (x86_64) | `crackattack-VERSION-linux-x86_64.AppImage` | `crackattack-VERSION-linux-x86_64.tar.gz` |

          The Windows installer needs no administrator rights; the macOS disk image holds the
          app, to drag into Applications; the AppImage runs as is (make it executable first).
          Archives: unpack anywhere and run. Your settings and scores are kept in your user folder.

          **macOS:** the application is not signed by Apple, so macOS blocks it the first time:
          - macOS 15 or later: open *Crack Attack.app* once, then go to *System Settings →
            Privacy & Security* and click **Open Anyway**;
          - macOS 14 or earlier: right-click (or Control-click) *Crack Attack.app*, choose
            **Open**, then confirm;
          - or, from a terminal (adjust the path if the app is elsewhere):
            `xattr -dr com.apple.quarantine "/Applications/Crack Attack.app"`

          ## Changes

          EOF
          sed -i "s/VERSION/$VERSION/g" notes.md
          # The notes of this version come from the release-notes folder, written before tagging.
          if [ -f "release-notes/$VERSION.md" ]; then
            cat "release-notes/$VERSION.md" >> notes.md
          else
            echo "(to be written before publishing)" >> notes.md
          fi
          # Betas are published as normal releases, not GitHub pre-releases: the update check
          # reads the "latest release" API, which ignores pre-releases. A beta (2.1.0-beta.1)
          # still sorts before the matching stable version.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Crack Attack! $VERSION" --notes-file notes.md
